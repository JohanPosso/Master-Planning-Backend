# Nombre fijo: renombrar la carpeta no crea una BD nueva y vacía (el volumen sigue siendo jornada-backend_jornada-data).
name: jornada-backend

services:
  db:
    image: postgres:16-alpine
    container_name: jornada-db
    environment:
      POSTGRES_USER: jornada
      POSTGRES_PASSWORD: jornada
      POSTGRES_DB: jornada
      TZ: Europe/Madrid
    ports:
      - "5433:5432"
    volumes:
      - jornada-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornada -d jornada"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jornada-data:
